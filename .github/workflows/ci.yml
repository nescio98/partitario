# Quality gates on every push and pull request; on a version tag (v1.2.3) the
# images are published to the GitHub container registry and a release is
# created with the two files a self-hosted install needs.
#
# Every job runs the same make targets a developer runs locally.

name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Hooks, types, tests
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA; bump the SHA and the
      # version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: django/uv.lock
      - name: Install dependencies
        run: cd django && uv sync --locked
      # Settings fail fast on missing variables; the example file is complete
      # and holds no secret.
      - name: Configuration
        run: cp .env.example .env
      # .config/pre-commit.yaml: ruff, mypy, shellcheck, hadolint, actionlint.
      # The gitleaks hook only looks at staged changes, hence `make secrets`.
      - name: Hooks
        run: make hooks-run
        env:
          SKIP: gitleaks
      - name: Secret scan
        run: make secrets
      - name: Translations
        run: make compilemessages
      # Throwaway PostgreSQL container: no Supabase, no service to configure.
      - run: make test

  smoke:
    name: Smoke test (real stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make smoke

  publish:
    name: Publish images and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to ghcr.io
    env:
      # amd64 servers and arm64 ones (Raspberry Pi, Apple silicon, Ampere).
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/partitario" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # arm64 is built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the application image
        run: |
          docker buildx build --push --platform "$PLATFORMS" --target production -f docker/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" django
      - name: Build and push the nginx image
        run: |
          docker buildx build --push --platform "$PLATFORMS" --target nginx -f docker/Dockerfile \
            --build-context docker=docker \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE-nginx:$VERSION" -t "$IMAGE-nginx:latest" django
      # The two files of a standalone install, pinned to this release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release
          cp docker/compose.selfhost.yaml release/compose.selfhost.yaml
          sed -e "s|^PARTITARIO_IMAGE=.*|PARTITARIO_IMAGE=$IMAGE|" \
              -e "s|^PARTITARIO_VERSION=.*|PARTITARIO_VERSION=$VERSION|" \
              .env.selfhost.example > release/env.selfhost.example
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            release/compose.selfhost.yaml release/env.selfhost.example
