# GitLab CI: the same checks as on a developer machine, through the same make
# targets (docs/development.md#continuous-integration-and-releases).
#
# The private runner uses the Docker executor with the host's Docker socket and
# host networking. /builds is a Docker volume, not a host directory, so a
# container started from a job cannot mount the checkout: `secrets` runs inside
# the gitleaks image instead of starting one.
#
# Validate changes with `make ci-lint` before pushing.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

default:
  tags: [local]
  interruptible: true

stages: [check]

variables:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.13.9-python3.13-trixie-slim
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_LINK_MODE: copy

# Python jobs: uv and Python from the image, make (and more) from apt. The
# settings (and mypy's Django plugin) need an environment: the development
# defaults of .env.example, as on a fresh checkout; `make test` overrides DB_*.
.uv:
  stage: check
  image: $UV_IMAGE
  variables:
    APT_PACKAGES: make
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends $APT_PACKAGES >/dev/null
    - cp .env.example .env
  cache:
    - key:
        files: [django/uv.lock]
      paths: [.cache/uv]

# One job for both: they share the environment, and every job costs a start.
lint-typecheck:
  extends: .uv
  script:
    - make lint typecheck

# The throwaway PostgreSQL runs on the host's Docker; host networking lets the
# job reach its loopback port.
test:
  extends: .uv
  variables:
    APT_PACKAGES: make docker-cli
  script:
    - make test

# The whole history, scanned from inside the gitleaks image.
secrets:
  stage: check
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache make >/dev/null
  script:
    - make secrets GITLEAKS=gitleaks GITLEAKS_REPO=.
